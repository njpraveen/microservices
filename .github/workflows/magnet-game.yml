name: Magnet Clash Android

on:
  push:
    paths:
      - "magnet-game/**"
      - ".github/workflows/magnet-game.yml"
  pull_request:
    paths:
      - "magnet-game/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magnet-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: magnet-clash-apk
          path: magnet-game/app/build/outputs/apk/debug/*.apk
